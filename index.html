<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ガチャアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        background-color: rgb(186, 176, 232);
        border-color: rgb(186, 176, 232);
        
      }

      .omikuji-controls{
        text-align: center;
      }

      h1{
        border-bottom: solid rgb(153, 139, 227);
        text-align: center;
      }

      .play{
        border-left: solid rgb(153, 139, 227) 4px;
        padding: 0px 5px;
      }

      h2{
        font-size: 40px;
        text-align: center;
      }

      .omikuji-history{
        text-align: center;
        padding: 0px 10px ;
      }

      h3{
        font-size: 25px;
        text-align: center;
        margin: 30px 0px 0px;
      }

      one,two,three,four,five,six,seven,eight,nine{
        margin: 0px 20px;
        font-size: 20px;
        border: solid rgb(186, 176, 232) 3px;
        border-radius: 5px;
        padding: 2px 20px;
      }

      
    

    </style>
  </head>

  <body>
    <h1>ガチャアプリ</h1>
    <div class="play">遊び方</div>
    <div class="test">クリックボタンを100回クリックするごとにガチャが引けます。ガチャの中身は全9種類！</div>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <!--　ようこ
      countedは回数表示するやつ。
      clickcheck-buttonは押すボタン。
      srcフォルダのclick.tsってファイルにこの動きを入れるプログラム組んだ。
      -->
      <h2 id="counted">0回</h2>
      <script type="module" src="/src/click.ts"></script>
      <button id="clickcheck-button">クリック</button>
      <script type="module" src="/src/click.ts"></script>
      <button id="draw-button">ノーマルガチャを引く</button>
      <button id="draw-rarebutton">レアガチャを引く</button>
      <script type="module" src="/src/click.ts"></script>
      <script type="module" src="/src/main.ts"></script>
      <button id="reset-button">リセット</button>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->

    <h3>りれき</h3>

    <div id="remaining" class="omikuji-remaining">
    <div id="history" class="omikuji-history">
      
      <p>
      <one>結果１</one>
      <two>結果２</two>
      <three>結果３</three>
      </p>
      <p>
      <four>結果４</four>
      <five>結果５</five>
      <six>結果６</six>
      </p>
      <p>
      <seven>結果７</seven>
      <eight>結果８</eight>
      <nine>結果９</nine>
      </p>
    </div>
    </div>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
