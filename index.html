<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ガチャアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        background-color: rgb(186, 176, 232);
        border-color: rgb(186, 176, 232);
        
      }

      .omikuji-controls{
        text-align: center;
      }

      h1{
        border-bottom: solid rgb(153, 139, 227);
        text-align: center;
      }

      .play{
        border-left: solid rgb(153, 139, 227) 4px;
        padding: 0px 5px;
      }

      h2{
        font-size: 40px;
        text-align: center;
      }

      .omikuji-history{
        text-align: center;
        padding: 0px 10px ;
      }

      h3{
        font-size: 25px;
        text-align: center;
        margin: 30px 0px 0px;
      }

      one2,two2,three2,four2,five2,six2,seven2,eight2,nine2{
        margin: 0px 10px;
        font-size: 20px;
        border: solid rgb(186, 176, 232) 3px;
        border-radius: 5px;
        padding: 2px 20px;
      }

      #one4,#two4,#three4,#four4,#five4,#six4,#seven4,#eight4,#nine4{
        margin: 0px 15px 0px 5px;
        background-color: rgb(232, 232, 250);
        border-color:  rgb(146, 146, 146);
        border-width: 2px;
        
      } 

    </style>
  </head>

  <body>
    <h1>ガチャアプリ</h1>
    <div class="play">遊び方</div>
    <div class="test">クリックボタンを10回クリックするごとにガチャが引けます。ガチャの中身は全9種類！</div>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <!--　ようこ
      countedは回数表示するやつ。
      clickcheck-buttonは押すボタン。
      srcフォルダのclick.tsってファイルにこの動きを入れるプログラム組んだ。
      -->
      <h2 id="counted">0回</h2>
      <button id="clickcheck-button">クリック</button>
      <button id="draw-button">ガチャを引く</button>
      <button id="reset-button">リセット</button>
    </div>
    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->

    <h3>りれき</h3>

    <div id="remaining" class="omikuji-remaining">
    <div id="history" class="omikuji-history">
      
      <!--
        結果を表示させるもの結果を<one2>でくくって、引いた回数を<one3>でくくり、全体を<one1>でくくっている
      -->

      <p>
      <one1 id="one1"><one2>結果１</one2><one3 id="one3">0</one3><button id="one4">売る</button></one1>
      <two1 id="two1"><two2>結果２</two2><two3 id="two3">0</two3><button id="two4">売る</button></two1>
      <three1 id="three1"><three2>結果３</three2><three3 id="three3">0</three3><button id="three4">売る</button></three1>
      </p>
      <p>
      <four1 id="four1"><four2>結果４</four2><four3 id="four3">0</four3><button id="four4">売る</button></four1>
      <five1 id="five1"><five2>結果５</five2><five3 id ="five3">0</five3><button id="five4">売る</button></five1>
      <six1 id="six1"><six2>結果６</six2><six3 id="six3">0</six3><button id="six4">売る</button></six1>
      </p>
      <p>
      <seven1 id="seven1"><seven2>結果７</seven2><seven3 id="seven3">0</seven3><button id="seven4">売る</button></seven1>
      <eight1 id="eight1"><eight2>結果８</eight2><eight3 id="eight3">0</eight3><button id="eight4">売る</button></eight1>
      <nine1 id="nine1"><nine2>結果９</nine2><nine3 id="nine3">0</nine3><button id="nine4">売る</button></nine1>
      </p>
    </div>
    </div>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/save.ts"></script> 
  </body>
</html>
