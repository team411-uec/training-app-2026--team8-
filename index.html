<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>おみくじアプリ</h1>
    <p>「おみくじを引く」ボタンを押してみましょう。</p>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <!--　ようこ
      countedは回数表示するやつ。
      clickcheck-buttonは押すボタン。
      srcフォルダのclick.tsってファイルにこの動きを入れるプログラム組んだ。
      -->
      <h1 id="counted">0回</h1>
      <script type="module" src="/src/main.ts"></script>
      <button id="clickcheck-button">☚</button>
      <script type="module" src="/src/main.ts"></script>
      <button id="draw-button">おみくじを引く</button>
      <button id="reset-button">リセット</button>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
